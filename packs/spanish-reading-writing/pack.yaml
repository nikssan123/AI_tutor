# Spanish: Reading & Writing — Standard Domain Pack
#
# The first pack in the `language` branch, and the one whose *name* is the
# honest part.
#
# §7.3 puts languages on the Audio and Conversation workspaces — pronunciation
# and speaking — and both are Phase 2. §7.3's own instruction for that gap is
# explicit: "until then those domains run in Standard mode with Text/Media
# submission and honestly lower confidence."
#
# A pack called "Spanish" that cannot hear you would be the overclaim §4.2 law 3
# rules out — the most important half of learning a language is the half this
# build cannot touch. So the pack is called what it is, every skill is a reading
# or writing skill, the subject card says speaking is not assessed, and the
# category blurb says it too. When the Conversation workspace ships, this
# becomes one half of a pack rather than something to be quietly renamed.
#
# **Tier 3.** Grammar, agreement, tense choice and vocabulary are checkable, so
# there is real technical feedback here. Whether a paragraph reads *naturally*
# to a native speaker is judgement, and this build does not have it. Tier 3 is
# exactly that split: "we check the technical side; whether it's any good is
# your call."

slug: spanish-reading-writing
name: "Spanish: Reading & Writing"
taxonomyParent: language
maturity: standard
evalTier: 3
workspace: text

evaluatorConfig:
  model: opus
  passes: 2
  verifier: quote-match
  tools: []

quality:
  status: draft
  reviewedBy: unreviewed # ← set to your name once you have read this end to end
  reviewedAt: null
  score: null

skills:
  # --- sentence --------------------------------------------------------------
  - slug: gender-and-agreement
    name: Gender and agreement
    description: >-
      Nouns carry gender and everything attached to them has to match. The most
      common source of error in beginner writing, and the easiest to check.
    level: foundational
    area: sentence
    evalTier: 3
    estimatedHours: 2
    canDoStatement: Write noun phrases where article, noun and adjective all agree in gender and number
    observableEvidence: [text]
    bktPriors: { pInit: 0.2, pLearn: 0.22, pSlip: 0.12, pGuess: 0.12 }

  - slug: present-tense
    name: The present tense
    description: >-
      Regular endings for the three verb families, and the handful of irregulars
      common enough that you cannot write a paragraph without them.
    level: foundational
    area: sentence
    evalTier: 3
    estimatedHours: 3
    canDoStatement: Conjugate regular and common irregular verbs in the present, correctly for the subject
    observableEvidence: [text]
    bktPriors: { pInit: 0.18, pLearn: 0.22, pSlip: 0.12, pGuess: 0.1 }

  - slug: ser-versus-estar
    name: Ser and estar
    description: >-
      Two verbs for "to be", split roughly by permanence and state. English gives
      you no intuition for this at all, which is why it needs its own skill.
    level: core
    area: sentence
    evalTier: 3
    estimatedHours: 2.5
    canDoStatement: Choose between ser and estar correctly and say which rule decided it
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.08, pLearn: 0.17, pSlip: 0.14, pGuess: 0.08 }

  - slug: word-order-and-pronouns
    name: Word order and object pronouns
    description: >-
      Where pronouns sit relative to the verb, and why Spanish drops the subject
      pronoun that English requires.
    level: core
    area: sentence
    evalTier: 3
    estimatedHours: 2.5
    canDoStatement: Place object pronouns correctly and drop subject pronouns where Spanish would
    observableEvidence: [text]
    bktPriors: { pInit: 0.07, pLearn: 0.16, pSlip: 0.14, pGuess: 0.07 }

  # --- time ------------------------------------------------------------------
  - slug: past-tenses
    name: Preterite and imperfect
    description: >-
      Two past tenses that split the job English does with one, along the line
      between a completed event and an ongoing state or habit.
    level: advanced
    area: time
    evalTier: 3
    estimatedHours: 3.5
    canDoStatement: Choose between preterite and imperfect in a narrative and justify each choice
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.05, pLearn: 0.14, pSlip: 0.15, pGuess: 0.05 }

  - slug: future-and-conditional
    name: Talking about what has not happened
    description: >-
      The future and conditional forms, and the very common near-future
      construction that lets you avoid both.
    level: core
    area: time
    evalTier: 3
    estimatedHours: 2
    canDoStatement: Express a plan, a prediction and a hypothetical, using the form that fits each
    observableEvidence: [text]
    bktPriors: { pInit: 0.08, pLearn: 0.17, pSlip: 0.13, pGuess: 0.08 }

  - slug: subjunctive-introduction
    name: Meeting the subjunctive
    description: >-
      What triggers it — wishes, doubt, emotion, the unreal — and recognising it
      in reading before you are asked to produce it.
    level: specialist
    area: time
    evalTier: 3
    estimatedHours: 3
    canDoStatement: Identify a subjunctive in a text and name what triggered it
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.03, pLearn: 0.12, pSlip: 0.16, pGuess: 0.04 }

  # --- reading ---------------------------------------------------------------
  - slug: reading-for-gist
    name: Reading for gist
    description: >-
      Getting the shape of a text without stopping at every unknown word — the
      habit that decides whether reading practice is bearable.
    level: foundational
    area: reading
    evalTier: 3
    estimatedHours: 2
    canDoStatement: Summarise an unfamiliar text in English without having looked up more than a few words
    observableEvidence: [text]
    bktPriors: { pInit: 0.2, pLearn: 0.22, pSlip: 0.11, pGuess: 0.12 }

  - slug: inferring-vocabulary
    name: Working out words from context
    description: >-
      Cognates, word families and surrounding grammar, and the false friends that
      make the strategy occasionally embarrassing.
    level: core
    area: reading
    evalTier: 3
    estimatedHours: 2
    canDoStatement: Infer a word's meaning from context and say what evidence in the sentence supports it
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.15, pLearn: 0.2, pSlip: 0.12, pGuess: 0.1 }

  - slug: register-in-reading
    name: Formal and informal
    description: >-
      Tú and usted, and the other markers that tell you what kind of text you are
      in before the content does.
    level: core
    area: reading
    evalTier: 3
    estimatedHours: 1.5
    canDoStatement: Identify a text's register from its verb forms and address, and say what signalled it
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.1, pLearn: 0.19, pSlip: 0.12, pGuess: 0.1 }

  # --- writing ---------------------------------------------------------------
  - slug: writing-a-paragraph
    name: Writing a connected paragraph
    description: >-
      Moving past isolated correct sentences to something that holds together,
      using the connectors that carry a Spanish paragraph.
    level: core
    area: writing
    evalTier: 3
    estimatedHours: 2.5
    canDoStatement: Write a paragraph whose sentences connect, using connectors rather than full stops alone
    observableEvidence: [text]
    bktPriors: { pInit: 0.09, pLearn: 0.17, pSlip: 0.13, pGuess: 0.07 }

  - slug: writing-for-a-purpose
    name: Writing for a purpose
    description: >-
      An email, a complaint, a description — where the conventions differ from
      English in ways that go beyond translating the words.
    level: advanced
    area: writing
    evalTier: 3
    estimatedHours: 2.5
    canDoStatement: Write a short functional text using the openings, closings and register a Spanish reader expects
    observableEvidence: [text]
    bktPriors: { pInit: 0.06, pLearn: 0.15, pSlip: 0.14, pGuess: 0.06 }

  - slug: self-correction
    name: Correcting your own writing
    description: >-
      A checklist pass over your own draft — agreement, verb endings, ser/estar,
      accents — which catches more than any amount of new grammar.
    level: advanced
    area: writing
    evalTier: 3
    estimatedHours: 2
    canDoStatement: Find and fix your own agreement and conjugation errors in a draft, and say what you looked for
    observableEvidence: [text, explanation]
    bktPriors: { pInit: 0.06, pLearn: 0.16, pSlip: 0.13, pGuess: 0.06 }

dependencies:
  - { from: gender-and-agreement, to: present-tense, type: soft, strength: 0.4 }
  - { from: present-tense, to: ser-versus-estar, type: hard }
  - { from: gender-and-agreement, to: ser-versus-estar, type: hard }
  - { from: present-tense, to: word-order-and-pronouns, type: hard }
  - { from: present-tense, to: past-tenses, type: hard }
  - { from: present-tense, to: future-and-conditional, type: hard }
  - { from: past-tenses, to: subjunctive-introduction, type: hard }
  - { from: ser-versus-estar, to: subjunctive-introduction, type: soft, strength: 0.5 }
  - { from: gender-and-agreement, to: reading-for-gist, type: soft, strength: 0.3 }
  - { from: reading-for-gist, to: inferring-vocabulary, type: hard }
  - { from: reading-for-gist, to: register-in-reading, type: hard }
  - { from: present-tense, to: register-in-reading, type: hard }
  - { from: word-order-and-pronouns, to: writing-a-paragraph, type: hard }
  - { from: inferring-vocabulary, to: writing-a-paragraph, type: soft, strength: 0.5 }
  - { from: writing-a-paragraph, to: writing-for-a-purpose, type: hard }
  - { from: register-in-reading, to: writing-for-a-purpose, type: hard }
  - { from: writing-a-paragraph, to: self-correction, type: hard }
  - { from: ser-versus-estar, to: self-correction, type: hard }
