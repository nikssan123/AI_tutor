# Diagnostic and retrieval item bank.
#
# §16.4 — production items outnumber multiple-choice at least 2:1.
#
# Only `correct` and `concepts` are read by anything, and `micro_artifact` is
# excluded from the check, so no skill may have one as its only item.
#
# **Nothing here asks the learner to say anything aloud.** This pack cannot hear
# them, and an item that pretended otherwise would be marking a claim it has no
# evidence for. See the note at the top of pack.yaml.

items:
  # --- gender-and-agreement --------------------------------------------------
  - slug: agreement-fix
    skill: gender-and-agreement
    type: short_text
    difficulty: 0.25
    prompt: >-
      Correct each phrase and say what was wrong: "el casa blanca", "las
      problema difíciles", "un mano pequeño".
    answerKey:
      concepts: [la-casa-blanca, los-problemas-difíciles, una-mano-pequeña, problema-is-masculine-and-mano-is-feminine-despite-their-endings]

  - slug: agreement-exceptions
    skill: gender-and-agreement
    type: explain
    difficulty: 0.4
    prompt: >-
      "-o is masculine, -a is feminine" is a useful rule that fails often enough
      to matter. Give three words that break it and say what pattern, if any,
      explains them.
    answerKey:
      concepts: [el-día-and-el-mapa-and-el-problema, la-mano-and-la-foto, many-greek-derived-ma-words-are-masculine]

  - slug: agreement-mcq
    skill: gender-and-agreement
    type: mcq
    difficulty: 0.25
    prompt: Which is correct?
    options:
      - "las aguas frías"
      - "el agua fría"
      - "la agua fría"
      - "el agua frío"
    answerKey: { correct: 1 }

  # --- present-tense ---------------------------------------------------------
  - slug: present-conjugate
    skill: present-tense
    type: short_text
    difficulty: 0.3
    prompt: >-
      Conjugate hablar, comer and vivir in the present for yo, tú and nosotros.
      Then say what the three endings have in common.
    answerKey:
      concepts: [hablo-hablas-hablamos, como-comes-comemos, vivo-vives-vivimos, the-yo-form-ends-in-o-for-all-three-families]

  - slug: present-irregular
    skill: present-tense
    type: short_text
    difficulty: 0.4
    prompt: >-
      Write the yo form of tener, hacer, ir and ser, and say which of the four is
      irregular in a way the others are not.
    answerKey:
      concepts: [tengo-hago-voy-soy, tener-and-hacer-are-go-verbs-in-the-yo-form-only, ir-and-ser-are-irregular-throughout]

  # --- ser-versus-estar ------------------------------------------------------
  - slug: ser-estar-choose
    skill: ser-versus-estar
    type: short_text
    difficulty: 0.45
    prompt: >-
      Fill each gap with ser or estar and give the reason: "Mi hermana ___
      médica", "La sopa ___ fría", "___ las tres de la tarde", "Nosotros ___ en
      Madrid".
    answerKey:
      concepts: [es-profession-is-an-identity, está-a-temporary-state, son-time-uses-ser, estamos-location-uses-estar]

  - slug: ser-estar-meaning-shift
    skill: ser-versus-estar
    type: explain
    difficulty: 0.6
    prompt: >-
      "Es aburrido" and "está aburrido" are both correct and mean different
      things. Explain the difference, and give another adjective that shifts the
      same way.
    answerKey:
      concepts: [es-aburrido-means-boring-as-a-characteristic, está-aburrido-means-bored-right-now, listo-means-clever-with-ser-and-ready-with-estar]

  - slug: ser-estar-mcq
    skill: ser-versus-estar
    type: mcq
    difficulty: 0.4
    prompt: "Which sentence says that the apple is unripe rather than a green variety?"
    options:
      - "La manzana es verde"
      - "La manzana está verde"
      - Both say the same thing
      - Neither; you would need a different adjective
    answerKey: { correct: 1 }

  # --- word-order-and-pronouns -----------------------------------------------
  - slug: pronoun-placement
    skill: word-order-and-pronouns
    type: short_text
    difficulty: 0.45
    prompt: >-
      Rewrite replacing the object with a pronoun, and say where it goes:
      "Veo el libro", "Quiero comprar el libro", "Estoy leyendo el libro".
    answerKey:
      concepts: [lo-veo-before-the-conjugated-verb, quiero-comprarlo-or-lo-quiero-comprar, estoy-leyéndolo-or-lo-estoy-leyendo, attaches-to-infinitive-or-gerund-or-goes-before-the-conjugated-verb]

  - slug: subject-dropping
    skill: word-order-and-pronouns
    type: explain
    difficulty: 0.4
    prompt: >-
      Spanish usually drops "yo" and "tú" where English cannot drop "I" and
      "you". Explain what makes that possible, and name a case where you would
      keep the pronoun anyway.
    answerKey:
      concepts: [the-verb-ending-already-identifies-the-subject, keep-it-for-contrast-or-emphasis, keep-it-where-the-ending-is-ambiguous-between-él-and-usted]

  # --- past-tenses -----------------------------------------------------------
  - slug: past-choose
    skill: past-tenses
    type: short_text
    difficulty: 0.6
    prompt: >-
      Choose preterite or imperfect for each and give the reason: "Cuando ___
      (ser) niño, ___ (vivir) en Sevilla", "Ayer ___ (comer) paella", "___
      (llover) cuando ___ (salir)".
    answerKey:
      concepts: [era-and-vivía-are-ongoing-background, comí-is-a-completed-event, llovía-is-the-background-and-salí-is-the-event-that-interrupts-it]

  - slug: past-explain
    skill: past-tenses
    type: explain
    difficulty: 0.65
    prompt: >-
      English uses one past tense where Spanish uses two. Describe the line
      between them in your own words, and give a pair of sentences where changing
      the tense changes the meaning rather than being an error.
    answerKey:
      concepts: [completed-bounded-event-versus-ongoing-or-habitual-state, sabía-means-i-knew-and-supe-means-i-found-out, conocía-versus-conocí]

  - slug: past-mcq
    skill: past-tenses
    type: mcq
    difficulty: 0.5
    prompt: "\"Todos los días caminaba al trabajo.\" Why imperfect?"
    options:
      - The action happened only once
      - The action was habitual and repeated
      - The speaker is uncertain it happened
      - Walking always takes the imperfect
    answerKey: { correct: 1 }

  # --- future-and-conditional ------------------------------------------------
  - slug: future-three-ways
    skill: future-and-conditional
    type: short_text
    difficulty: 0.4
    prompt: >-
      Say "I am going to eat later" three ways — near future, simple future, and
      present used for a plan — and say which you would actually use in speech.
    answerKey:
      concepts: [voy-a-comer-más-tarde, comeré-más-tarde, como-más-tarde, the-ir-a-construction-is-the-most-common-in-conversation]

  - slug: conditional-use
    skill: future-and-conditional
    type: explain
    difficulty: 0.5
    prompt: >-
      Beyond "would", the conditional has a politeness use. Give an example, and
      say what it softens.
    answerKey:
      concepts: [querría-or-podría-instead-of-quiero-or-puedes, softens-a-request-into-something-declinable, same-move-as-english-i-would-like]

  # --- subjunctive-introduction ----------------------------------------------
  - slug: subjunctive-spot
    skill: subjunctive-introduction
    type: short_text
    difficulty: 0.6
    prompt: >-
      Find the subjunctive in "Espero que tengas un buen día" and say which word
      triggered it.
    answerKey:
      concepts: [tengas-is-the-subjunctive, espero-que-expresses-a-wish, wishes-and-doubt-and-emotion-trigger-it]

  - slug: subjunctive-triggers
    skill: subjunctive-introduction
    type: explain
    difficulty: 0.7
    prompt: >-
      Name three categories of expression that trigger the subjunctive, with an
      example of each, and say what they have in common.
    answerKey:
      concepts: [wishes-and-requests, doubt-and-denial, emotion-and-value-judgements, none-of-them-assert-that-something-is-a-fact]

  # --- reading-for-gist ------------------------------------------------------
  - slug: gist-strategy
    skill: reading-for-gist
    type: explain
    difficulty: 0.3
    prompt: >-
      You hit a paragraph with six words you do not know. Describe what you do,
      in order, before reaching for a dictionary.
    answerKey:
      concepts: [read-the-whole-paragraph-first, identify-the-verbs-and-who-is-doing-what, look-up-only-words-that-block-the-main-idea]

  - slug: gist-summarise
    skill: reading-for-gist
    type: micro_artifact
    difficulty: 0.45
    prompt: >-
      Find a short Spanish news article. Summarise it in English in three
      sentences, then list the words you looked up. Aim for fewer than five.
    answerKey:
      concepts: [summary-captures-who-did-what, fewer-than-five-lookups, lookups-were-blocking-words-not-curiosities]

  - slug: gist-mcq
    skill: reading-for-gist
    type: mcq
    difficulty: 0.3
    prompt: The most useful first pass over an unfamiliar Spanish text is to…
    options:
      - Translate each sentence fully before moving on
      - Read the whole thing once for shape, ignoring unknown words
      - Look up every unknown word first, then read
      - Read it backwards, sentence by sentence
    answerKey: { correct: 1 }

  # --- inferring-vocabulary --------------------------------------------------
  - slug: infer-cognates
    skill: inferring-vocabulary
    type: short_text
    difficulty: 0.35
    prompt: >-
      Guess the meaning of "la responsabilidad", "el desarrollo" and "actualmente"
      from their shape, then say which one you got wrong and why.
    answerKey:
      concepts: [responsibility-and-development-are-straightforward, actualmente-means-currently-not-actually, false-friends-look-most-obvious-when-they-are-wrong]

  - slug: infer-evidence
    skill: inferring-vocabulary
    type: explain
    difficulty: 0.5
    prompt: >-
      Take an unknown word in a sentence you are reading. Describe the evidence
      in the sentence you would use to pin down its meaning and its part of
      speech.
    answerKey:
      concepts: [what-article-or-ending-it-carries, what-it-is-doing-grammatically, what-would-make-sense-given-the-rest-of-the-clause]

  # --- register-in-reading ---------------------------------------------------
  - slug: register-signals
    skill: register-in-reading
    type: short_text
    difficulty: 0.4
    prompt: >-
      Name three things in a Spanish text that tell you it is formal rather than
      informal, before you have read the content.
    answerKey:
      concepts: [usted-forms-rather-than-tú, formal-openings-and-closings, longer-sentences-and-no-contractions-or-slang]

  - slug: register-mcq
    skill: register-in-reading
    type: mcq
    difficulty: 0.35
    prompt: "\"Le escribo para solicitar información.\" This is…"
    options:
      - Informal, to a friend
      - Formal, to someone addressed as usted
      - Regional, and not standard
      - Ungrammatical
    answerKey: { correct: 1 }

  # --- writing-a-paragraph ---------------------------------------------------
  - slug: paragraph-connectors
    skill: writing-a-paragraph
    type: short_text
    difficulty: 0.45
    prompt: >-
      List six connectors you would use to join sentences in a Spanish paragraph,
      grouped by what they do — adding, contrasting, concluding.
    answerKey:
      concepts: [además-and-también-add, sin-embargo-and-pero-contrast, por-lo-tanto-and-en-conclusión-conclude]

  - slug: paragraph-write
    skill: writing-a-paragraph
    type: micro_artifact
    difficulty: 0.55
    prompt: >-
      Write a paragraph of six to eight sentences in Spanish about your week.
      Use at least three different connectors and at least two tenses.
    answerKey:
      concepts: [sentences-connect-rather-than-listing, three-connectors-used-correctly, two-tenses-used-and-chosen-correctly]

  # --- writing-for-a-purpose -------------------------------------------------
  - slug: purpose-email
    skill: writing-for-a-purpose
    type: short_text
    difficulty: 0.5
    prompt: >-
      Give a formal opening and closing for a Spanish email to someone you have
      never met, and say what an English writer typically gets wrong here.
    answerKey:
      concepts: [estimado-or-estimada-plus-surname, un-saludo-cordial-or-atentamente, english-writers-are-too-informal-too-fast-and-translate-best-wishes-literally]

  - slug: purpose-conventions
    skill: writing-for-a-purpose
    type: explain
    difficulty: 0.55
    prompt: >-
      Name two conventions in Spanish functional writing that differ from English
      beyond vocabulary, and say what happens if you ignore them.
    answerKey:
      concepts: [usted-by-default-with-strangers, more-formulaic-openings-and-closings, ignoring-them-reads-as-rude-rather-than-friendly]

  # --- self-correction -------------------------------------------------------
  - slug: correct-checklist
    skill: self-correction
    type: short_text
    difficulty: 0.45
    prompt: >-
      Write the checklist you would run over your own Spanish draft, in the order
      you would run it.
    answerKey:
      concepts: [agreement-of-articles-and-adjectives, verb-endings-against-their-subjects, ser-versus-estar, accents-and-ñ]

  - slug: correct-find
    skill: self-correction
    type: explain
    difficulty: 0.55
    prompt: >-
      Find and fix the four errors: "Ayer yo comía una paella muy bueno en un
      restaurante que es cerca de mi casa."
    answerKey:
      concepts: [comí-not-comía-for-a-completed-event, buena-to-agree-with-paella, está-not-es-for-location, yo-is-unnecessary-and-unidiomatic-here]
