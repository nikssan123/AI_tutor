# Graded project briefs.
#
# Every rubric criterion appears in the acceptance list below.
#
# None of these asks the learner to speak, and none is marked on how natural the
# result sounds — see the note at the top of rubrics.yaml. What is being
# certified is control of the written language.

projects:
  - slug: a-week-in-two-tenses
    title: Write a week, in two tenses
    rubric: accuracy
    evidenceType: text
    difficulty: 0.5
    estimatedMinutes: 75
    isPublic: true
    targetSkills: [gender-and-agreement, present-tense, past-tenses, ser-versus-estar]
    brief: >-
      Write 250–350 words in Spanish about a week you have actually had. Use the
      present for what is generally true and the past for what happened, and
      choose between preterite and imperfect deliberately.

      Somewhere in the piece, use ser and estar with the same adjective so the
      choice carries meaning rather than merely being correct.
    acceptanceCriteria:
      - 250–350 words in Spanish.
      - Agreement correct throughout, including where an adjective is separated from its noun.
      - Verbs correct for person and number, across at least two tenses used deliberately.
      - Ser and estar correct throughout, including one place where the choice changes the meaning.
      - Written accents correct, including on preterite endings.

  - slug: read-and-report
    title: Read something real and report it back
    rubric: reading-comprehension
    evidenceType: text
    difficulty: 0.55
    estimatedMinutes: 90
    isPublic: true
    targetSkills: [reading-for-gist, inferring-vocabulary, register-in-reading]
    brief: >-
      Find a Spanish text you have not read before — a news article, an opinion
      column, a long product review. Not a graded reader.

      Summarise it in English, then account for how you read it. The discipline
      being marked is doing this without translating every word: a short lookup
      list is a better result than a complete one.
    acceptanceCriteria:
      - The source, with a link.
      - An English summary that says who did what and why, and separates the text's own claims from those it reports.
      - Every inferred word tied to the evidence in its sentence that supported the guess.
      - At least one inference you reconsidered, and what changed your mind.
      - A list of the words you looked up, each one blocking the main idea, and one you deliberately left.
      - Whether the text is formal or informal, with signals from both address and sentence construction.

  - slug: write-to-a-stranger
    title: Write to someone you have never met
    rubric: functional-writing
    evidenceType: text
    difficulty: 0.6
    estimatedMinutes: 75
    isPublic: true
    targetSkills: [writing-for-a-purpose, register-in-reading, writing-a-paragraph, self-correction]
    brief: >-
      Write a real functional text in Spanish: an enquiry to a language school, a
      complaint about an order, a request for information from a council office.
      Something with an actual purpose and an actual reader.

      Then correct it yourself, and hand in both the corrections and the final
      version. The self-correction pass is a third of what is being marked here,
      because it is the habit that improves writing fastest.
    acceptanceCriteria:
      - A stated reader and purpose, with the purpose clear in the opening lines.
      - Register consistent and appropriate, using conventional Spanish openings and closings rather than translated English ones.
      - Varied connectors carrying the piece, including at least one contrast or concession.
      - Your own corrections listed, grouped by the kind of error, with the pattern you noticed named.
