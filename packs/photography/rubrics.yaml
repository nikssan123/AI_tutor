# §7.2 Tier 3 — "Technical feedback. Aesthetic judgement is yours."
#
# Every criterion below is something a machine can actually assess from the
# file: exposure, focus plane, clipping, colour consistency, edge content. There
# is deliberately no criterion for composition-as-taste, impact, or beauty.
# Adding one would be the overclaiming §4.2 law 3 forbids — and would quietly
# make every other verdict in the ledger less believable.

rubrics:
  - slug: exposure-control
    version: 1
    isPublic: true
    criteria:
      - id: exposure-intent
        name: Exposure matches the stated intent
        description: The frame is exposed the way the submission says it meant to be — not merely "correct".
        weight: 0.3
        marks: both
        bands:
          absent: Exposure does not match the stated intent and no reason is given.
          developing: Close, but more than a stop from what was described.
          competent: Within about half a stop of the stated intent.
          strong: On intent, with the compensation decision explained.
      - id: clipping
        name: Nothing is clipped by accident
        description: Highlights and shadows retain detail unless the submission says they were sacrificed on purpose.
        weight: 0.3
        marks: both
        bands:
          absent: Significant clipping at one or both ends, unacknowledged.
          developing: Minor clipping, unacknowledged.
          competent: No accidental clipping.
          strong: No accidental clipping, and any deliberate sacrifice is named and justified.
      - id: settings-reported
        name: Settings support the claim
        description: EXIF or reported settings are consistent with what the submission says was done.
        weight: 0.2
        marks: text
        bands:
          absent: Settings contradict the description.
          developing: Settings partially reported or partially consistent.
          competent: Reported and consistent.
          strong: Reported, consistent, and the trade-off chosen is explained.
      - id: repeatability
        name: The result was controlled, not lucky
        description: Across the submitted frames, the effect is consistent enough to look deliberate.
        weight: 0.2
        marks: both
        bands:
          absent: One frame works; the others do not.
          developing: Inconsistent across frames.
          competent: Consistent across the set.
          strong: Consistent, and variation between frames is itself explained.

  - slug: light-and-separation
    version: 1
    isPublic: true
    criteria:
      - id: focus-plane
        name: Focus lands where intended
        description: The stated subject is the sharpest thing in the frame.
        weight: 0.3
        marks: both
        bands:
          absent: Focus is on something other than the stated subject.
          developing: Slightly off — a lash rather than an eye, a shoulder rather than a face.
          competent: On the intended plane.
          strong: On plane at a wide aperture, demonstrated with a crop.
      - id: light-direction-effect
        name: The lighting does what was claimed
        description: The described direction and quality of light are visible in the shadows.
        weight: 0.3
        marks: both
        bands:
          absent: Shadows contradict the description.
          developing: Direction visible, quality misdescribed, or vice versa.
          competent: Both direction and quality match the description.
          strong: Match, plus a stated reason for the choice.
      - id: separation
        name: The subject is unmistakable
        description: Measurable separation from the background — tonal, colour, or focus.
        weight: 0.25
        marks: both
        bands:
          absent: The subject competes with the background for attention.
          developing: Separated by one weak means only.
          competent: Clearly separated, with the method identifiable.
          strong: Clearly separated, and the submission names which tools it used.
      - id: edges
        name: The edges were a decision
        description: No mergers, half-objects or bright distractions at the frame edge that go unmentioned.
        weight: 0.15
        marks: both
        bands:
          absent: Several unaddressed edge problems.
          developing: One unaddressed edge problem.
          competent: Edges are clean.
          strong: Edges are clean, and the submission says what it moved to fix them.

  - slug: coherent-set
    version: 1
    isPublic: true
    criteria:
      - id: colour-consistency
        name: Colour reads as one set
        description: White balance is consistent across frames, or varies for a stated reason.
        weight: 0.3
        marks: both
        bands:
          absent: Visible temperature drift between frames.
          developing: Mostly consistent, one frame adrift.
          competent: Consistent across the set.
          strong: Consistent, with a named reference frame the others were matched to.
      - id: tonal-consistency
        name: Contrast and black point are consistent
        description: Frames share a tonal treatment rather than being edited one at a time.
        weight: 0.3
        marks: both
        bands:
          absent: Each frame has its own contrast character.
          developing: Broadly similar, with one or two outliers.
          competent: Consistent black point and contrast across the set.
          strong: Consistent, and demonstrated with histograms.
      - id: technical-floor
        name: Every frame clears the technical floor
        description: No frame in the set has accidental clipping, missed focus, or an unaddressed edge problem.
        weight: 0.25
        marks: both
        bands:
          absent: Two or more frames fall below the floor.
          developing: One frame falls below.
          competent: All frames clear it.
          strong: All clear it, and the weakest frame is identified by the author.
      - id: stated-approach
        name: The approach is stated
        description: The submission says what it standardised on, so the result can be judged as deliberate.
        weight: 0.15
        marks: text
        bands:
          absent: No description of the approach.
          developing: Vague description.
          competent: Specific and matches what the files show.
          strong: Specific, matches, and explains the frames that needed exceptions.
